kind: Deployment
apiVersion: apps/v1
metadata:
  name: workplace-per-base
  namespace: hmr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workplace-per-base
      version: v1
  template:
    metadata:
      labels:
        app: workplace-per-base
        version: v1
    spec:
      volumes:
        - name: vol-workplace-per-base-config
          configMap:
            name: workplace-per-base-config
            defaultMode: 420
      containers:
        - name: container-workplace-per-base
          image: swr.ckgf-global-1.cccar.com.cn/work_place/workplace-per-base-product:1.0.0
          resources:
            limits:
              cpu: '4'
              memory: 4Gi
            requests:
              cpu: '4'
              memory: 4Gi
          volumeMounts:
            - name: vol-workplace-per-base-config
              readOnly: true
              mountPath: /home/workplace/bootstrap.yml
              subPath: bootstrap.yml
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - '-c'
                  - sleep 60 && curl -X GET http://127.0.0.1:11501/deregister
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always

          readinessProbe:
            httpGet:
              path: /hrEmpBasic/isAvailable
              port: 8864
              host: ''
              scheme: HTTP
            initialDelaySeconds: 40
            timeoutSeconds: 5
            periodSeconds: 20
            successThreshold: 1
            failureThreshold: 30

      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      imagePullSecrets:
        - name: default-secret
      schedulerName: default-scheduler
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
