kind: Deployment
apiVersion: apps/v1
metadata:
  name: workplace-human-resource
  namespace: human-resource
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workplace-human-resource
      version: v1
  template:
    metadata:
      labels:
        app: workplace-human-resource
        version: v1
    spec:
      volumes:
        - name: vol-workplace-human-resource-config
          configMap:
            name: workplace-human-resource-config
            defaultMode: 420
      containers:
        - name: container-workplace-human-resource
          image: swr.ckgf-global-1.cccar.com.cn/work_place/workplace-human-resource-test:0.0.1
          resources:
            limits:
              cpu: '4'
              memory: 4Gi
            requests:
              cpu: '2'
              memory: 2Gi
          volumeMounts:
            - name: vol-workplace-human-resource-config
              readOnly: true
              mountPath: /home/workplace/application.yml
              subPath: application.yml
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      imagePullSecrets:
        - name: default-secret
      schedulerName: default-scheduler
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
